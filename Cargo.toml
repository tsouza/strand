[workspace]
resolver = "3"
members = ["crates/strand-core", "crates/strand-datafusion", "crates/strand-lexical", "crates/strand-tools", "crates/strand-vector", "bench"]
# bench/ always needs the AWS SDK (it benchmarks against real MinIO), so it's
# excluded from the default member set: `cargo build`/`cargo test` (no
# --workspace) skip it, keeping the ordinary dev loop free of that compile
# cost; `cargo build -p strand-bench` or `--workspace` still reach it.
# strand-datafusion pulls in the datafusion crate (a heavy compile, like
# strand-tools' tantivy dependency already is) but needs no network or
# credentials, so unlike bench/ it stays in the default set.
default-members = ["crates/strand-core", "crates/strand-datafusion", "crates/strand-lexical", "crates/strand-tools", "crates/strand-vector"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tsouza/strand"
