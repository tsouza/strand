[package]
name = "strand-vector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STRAND vector-family blobs: flat vectors, RaBitQ quantization descriptor, cluster navigation tier, cluster posting lists (RFC 0010)"

[dependencies]
rand = "0.9.2"
strand-core = { path = "../strand-core" }
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
proptest = "1.11.0"
