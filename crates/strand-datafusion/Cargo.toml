[package]
name = "strand-datafusion"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin, read-only Apache DataFusion TableProvider over STRAND lexical-family segments (M5, docs/milestones.md)"

[dependencies]
async-trait = "0.1.89"
datafusion = "55.0.0"
strand-core = { path = "../strand-core" }
strand-lexical = { path = "../strand-lexical" }

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
