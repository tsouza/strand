[package]
name = "strand-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STRAND container, row-ID, and manifest reference implementation"

[[bin]]
# The RFC 0002 §2 Workflow II DST cross-validation harness: replays
# TLC-generated action sequences from verification/manifest.tla against the
# real commit()/commit_deletion_vector()/read_snapshot() below. Lives in
# strand-core (not strand-bench) because, unlike bench/'s MinIO-backed
# benchmarks, it needs no network or credentials — only java + tla2tools.jar
# — and it exercises this crate's own public API as an external caller
# would, the same reasoning bench/'s binaries already follow.
name = "dst-manifest-harness"
path = "src/bin/dst_manifest_harness/main.rs"

[dependencies]
aws-config = { version = "1.10.1", optional = true }
aws-sdk-s3 = { version = "1.142.0", optional = true }
aws-smithy-types = { version = "1.6.2", optional = true }
roaring = "0.11.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt"], optional = true }
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }

[lints.clippy]
all = { level = "deny", priority = -1 }

[features]
# A real S3/MinIO-backed ConditionalStore. Off by default so a build that
# only needs the format (container/manifest logic, no network I/O) doesn't
# pay for the AWS SDK's compile time and dependency surface.
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-smithy-types", "dep:tokio"]

[dev-dependencies]
proptest = "1.11.0"
testcontainers-modules = { version = "0.15.0", features = ["minio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
