[package]
name = "strand-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STRAND container, row-ID, and manifest reference implementation"

[dependencies]
aws-config = { version = "1.10.1", optional = true }
aws-sdk-s3 = { version = "1.142.0", optional = true }
aws-smithy-types = { version = "1.6.2", optional = true }
roaring = "0.11.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt"], optional = true }
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }

[lints.clippy]
all = { level = "deny", priority = -1 }

[features]
# A real S3/MinIO-backed ConditionalStore. Off by default so a build that
# only needs the format (container/manifest logic, no network I/O) doesn't
# pay for the AWS SDK's compile time and dependency surface.
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-smithy-types", "dep:tokio"]

[dev-dependencies]
# strand-lexical and strand-vector both depend on strand-core as a normal
# dependency; the reverse edge here is dev-only (test-only), so this is a
# supported Cargo dev-dependency cycle, not a real circular build
# dependency — needed because `tests/hybrid_rrf_end_to_end.rs` (M3-6,
# `docs/roadmap.md`) is the one place in this project that builds a real
# segment carrying both blob families over one row-ID space and needs
# both crates to do it.
proptest = "1.11.0"
rand = "0.9.2"
strand-lexical = { path = "../strand-lexical" }
strand-vector = { path = "../strand-vector" }
testcontainers-modules = { version = "0.15.0", features = ["minio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
