[package]
name = "strand-lexical"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STRAND lexical-family blobs: term-dictionary FST and term-info store (RFC 0005)"

[dependencies]
bitpacking = "0.9.3"
fst = "0.4.7"
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
roaring = "0.11.5"
rust-stemmers = "1.2.0"
strand-core = { path = "../strand-core" }
unicode-segmentation = "1.13.3"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.151"
