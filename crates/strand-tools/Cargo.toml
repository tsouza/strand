[package]
name = "strand-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STRAND CLI: inspect, verify, convert, sweep"

[lib]
name = "strand_tools"
path = "src/lib.rs"

[[bin]]
name = "strand-tools"
path = "src/main.rs"

[dependencies]
aws-config = "1.10.1"
aws-sdk-s3 = "1.142.0"
clap = { version = "4.6.6", features = ["derive"] }
# `export-puffin` (RFC 0013, M4-5): CRC-32 (IEEE/ISO-HDLC) is
# `deletion-vector-v1`'s own checksum, quoted verbatim in
# `references/puffin-spec-and-iceberg-rust-implementation.md` — a second
# checksum algorithm scoped only to this export path (invariant 11's
# checklist), never STRAND's own xxHash3-64 default. Already present in
# this workspace's dependency tree (a transitive dependency of several
# crates already in `Cargo.lock`), so this adds no new supply-chain surface.
crc32fast = "1.5.0"
prost = "0.14.4"
# The `sweep` subcommand (M3-5) talks to real S3-compatible object storage,
# the same way `convert` unconditionally depends on `tantivy` for its own
# real-format import rather than being feature-gated off by default.
serde_json = "1.0.151"
strand-core = { path = "../strand-core", features = ["s3"] }
strand-lexical = { path = "../strand-lexical" }
tantivy = "0.26.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
tempfile = "3.20.0"
testcontainers-modules = { version = "0.15.0", features = ["minio"] }
