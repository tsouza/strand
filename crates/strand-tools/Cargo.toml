[package]
name = "strand-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STRAND CLI: inspect, verify, convert, sweep"

[lib]
name = "strand_tools"
path = "src/lib.rs"

[[bin]]
name = "strand-tools"
path = "src/main.rs"

[dependencies]
aws-config = "1.10.1"
aws-sdk-s3 = "1.142.0"
clap = { version = "4.6.6", features = ["derive"] }
# The `sweep` subcommand (M3-5) talks to real S3-compatible object storage,
# the same way `convert` unconditionally depends on `tantivy` for its own
# real-format import rather than being feature-gated off by default.
serde_json = "1.0.151"
strand-core = { path = "../strand-core", features = ["s3"] }
strand-lexical = { path = "../strand-lexical" }
tantivy = "0.26.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
tempfile = "3.20.0"
testcontainers-modules = { version = "0.15.0", features = ["minio"] }
