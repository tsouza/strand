[package]
name = "strand-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STRAND CLI: inspect, verify, convert"

[[bin]]
name = "strand-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
strand-core = { path = "../strand-core" }

[lints.clippy]
all = { level = "deny", priority = -1 }
