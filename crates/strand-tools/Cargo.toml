[package]
name = "strand-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STRAND CLI: inspect, verify, convert"

[lib]
name = "strand_tools"
path = "src/lib.rs"

[[bin]]
name = "strand-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
prost = "0.14.4"
strand-core = { path = "../strand-core" }
strand-lexical = { path = "../strand-lexical" }
tantivy = "0.26.1"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
tempfile = "3.20.0"
