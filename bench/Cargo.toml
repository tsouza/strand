[package]
name = "strand-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STRAND end-to-end benchmarks against real MinIO, per CLAUDE.md §7"
publish = false

[lib]
name = "strand_bench"
path = "src/lib.rs"

[[bin]]
name = "cold-open"
path = "src/cold_open.rs"

[[bin]]
name = "commit-contention"
path = "src/commit_contention.rs"

[[bin]]
name = "codec-decode-throughput"
path = "src/codec_decode_throughput.rs"

[[bin]]
name = "msmarco-index"
path = "src/msmarco_index.rs"

[[bin]]
name = "hybrid-codec-pilot"
path = "src/hybrid_codec_pilot.rs"

[[bin]]
name = "tantivy-index"
path = "src/tantivy_index.rs"

[[bin]]
name = "field-end-to-end"
path = "src/field_end_to_end.rs"

[[bin]]
name = "field-cold-open"
path = "src/field_cold_open.rs"

[[bin]]
name = "tantivy-import-scale"
path = "src/tantivy_import_scale.rs"

[[bin]]
name = "vector-cold-open"
path = "src/vector_cold_open.rs"

[[bin]]
name = "parallel-range-fetch"
path = "src/parallel_range_fetch.rs"

[dependencies]
strand-core = { path = "../crates/strand-core", features = ["s3"] }
strand-lexical = { path = "../crates/strand-lexical" }
strand-tools = { path = "../crates/strand-tools" }
strand-vector = { path = "../crates/strand-vector" }
aws-config = "1.10.1"
aws-sdk-s3 = "1.142.0"
bitpacking = "0.9.3"
fastlanes = "0.6.1"
fastpfor = "0.9.0"
flate2 = "1.1.9"
rand = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sucds = "0.8.3"
tantivy = "0.26.1"
tempfile = "3.20.0"
testcontainers-modules = { version = "0.15.0", features = ["minio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
