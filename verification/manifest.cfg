CONSTANTS
    \* w3 added alongside RFC 0012's DeleteWriter (below) specifically to
    \* avoid silently losing the original append-vs-append coverage: pinning
    \* DeleteWriter to one of only two writers would leave a single
    \* append-capable writer, eliminating the append-vs-append racing this
    \* model already existed to check. w1/w2 keep exactly the original
    \* 2-append-writer scenario; w3 layers the new revise-shaped writer on
    \* top of it, not in place of it.
    Writers = {w1, w2, w3}
    Readers = {r1}
    ReaderRetryLimit = 2
    DistinguishedWriter = w1
    DeleteWriter = w3
    NoProposalVal = NoProposalVal
    NoResultVal = NoResultVal
    NoCommitsYetVal = NoCommitsYetVal
INIT Init
NEXT Next
INVARIANT TypeOK
INVARIANT NoOverlappingRowIds
INVARIANT MonotonicNextRowId
INVARIANT VersionsMatchIndex
INVARIANT NextRowIdMatchesSegments
INVARIANT SegmentCountNeverDecreases
INVARIANT DeletionVectorCommitsOnlyReviseOneEntry
INVARIANT ReaderSeesOnlyCommitted
INVARIANT WriterSuccessIsCommitted
CHECK_DEADLOCK FALSE
